<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel GP Racing: a 16x16 pixel-art F1 car seen from above, nose up. -->
  <!-- Outline and tyres -->
  <g fill="#10131a">
    <rect x="2" y="1" width="12" height="3" />
    <rect x="6" y="3" width="4" height="4" />
    <rect x="2" y="4" width="3" height="4" />
    <rect x="11" y="4" width="3" height="4" />
    <rect x="4" y="6" width="8" height="7" />
    <rect x="1" y="9" width="4" height="5" />
    <rect x="11" y="9" width="4" height="5" />
    <rect x="3" y="13" width="10" height="3" />
  </g>
  <!-- Body -->
  <g fill="#e23b3b">
    <rect x="3" y="2" width="10" height="1" />
    <rect x="7" y="3" width="2" height="4" />
    <rect x="5" y="7" width="6" height="5" />
    <rect x="4" y="14" width="8" height="1" />
  </g>
  <!-- Cockpit and helmet -->
  <rect x="6" y="7" width="4" height="4" fill="#10131a" />
  <rect x="7" y="8" width="2" height="2" fill="#f2c531" />
  <!-- Nose stripe -->
  <rect x="7" y="2" width="2" height="1" fill="#f5f5f5" />
  <!-- Tyre tread -->
  <g fill="#3a4256">
    <rect x="3" y="5" width="1" height="2" />
    <rect x="12" y="5" width="1" height="2" />
    <rect x="2" y="10" width="2" height="3" />
    <rect x="12" y="10" width="2" height="3" />
  </g>
</svg>
